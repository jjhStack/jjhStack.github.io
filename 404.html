<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<script>
  // The blog used to live at the site root. Send its old links to /blog.
  (function () {
    var p = location.pathname;
    if (/^\/(posts|categories|tags|archives|about|feed\.xml|sitemap\.xml)(\/|$)/.test(p)) {
      location.replace("/blog" + p + location.search + location.hash);
    }
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #142042; color: #fff;
         font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; text-align: center; padding: 16px; }
  h1 { font-size: 2rem; margin: 0 0 12px; }
  p { color: #c9d2f0; margin: 0 0 24px; }
  a { color: #aebbff; font-weight: 700; margin: 0 10px; }
</style>
</head>
<body>

</body>
